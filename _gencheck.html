<!doctype html><meta charset="utf-8"><title>gen check</title>
<!-- Runs 00_data.js + 00c_worldgen.js ALONE, with nothing else in the page, and prints what the
     generator produced or the error it threw. The full game swallows a throw here: 00c runs before
     01_constants.js, and a failure there leaves ROOM_DEFS['G'] undefined so every later file dies on
     something unrelated -- the world audit reported "cannot read properties of undefined (reading
     rings)", which is forty lines downstream of the actual fault.
     ?strip=1 also dumps the tiles across the bridge, which is the only way to SEE whether the
     causeway actually lands on both shores. -->
<pre id="o" style="font:11px/1.15 monospace;color:#9f9;background:#000;padding:8px;white-space:pre">pending</pre>
<script src="00_data.js"></script>
<script>
const L=[];
window.addEventListener('error',(e)=>{ L.push('WINDOW ERROR: '+e.message+'\n  at '+e.filename+':'+e.lineno);
  document.getElementById('o').textContent=L.join('\n'); });
</script>
<script src="00c_worldgen.js"></script>
<script>
const o=document.getElementById('o');
try{
  const D=ROOM_DEFS['G'];
  if(!D) throw new Error('ROOM_DEFS.G is '+D);
  L.push('OK  '+D.w+'x'+D.h+'  hash '+WORLD_HASH);
  L.push('rows '+D.map.length+'  cols '+D.map[0].length);
  const c={}; let land=0;
  for(const row of D.map) for(const ch of row){ c[ch]=(c[ch]||0)+1; if(ch!=='w') land++; }
  L.push('land '+land);
  L.push('mix  '+Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>k+':'+c[k]).join('  '));
  L.push('gen  '+JSON.stringify(D._gen));

  // THE BRIDGE, AS TILES. A causeway that ends one tile short of a shore is invisible in every
  // aggregate number in this file and obvious the moment you print the strip.
  const B=D.rings.bridge, half=(B.w/2)|0;
  L.push('');
  L.push('bridge x'+B.x0+'..'+B.x1+' at y'+B.cy+' w'+B.w
         +'   island A slice ends at x'+(ISLE_A_W-1));
  const x0=B.x0-26, x1=B.x1+26;
  L.push('        x='+x0+' ..'+' x='+x1);
  for(let y=B.cy-half-3; y<B.cy-half+B.w+3; y++){
    let s='';
    for(let x=x0;x<=x1;x++) s+=D.map[y][x];
    L.push(('y'+y).padEnd(7)+s);
  }
  // THE PLAYER SPAWN. 02_worldbuild reads the 'P' marker into r.px/r.py and that is where every new
  // character arrives -- so if it is wet, the game opens with the hero standing in the sea.
  let px=-1, py=-1;
  for(let y=0;y<D.h && px<0;y++){ const i=D.map[y].indexOf('P'); if(i>=0){ px=i; py=y; } }
  const solidS='WhlHwXD';
  L.push('');
  if(px<0) L.push('SPAWN: no P marker in the map at all');
  else {
    const c=D.map[py][px];
    L.push('SPAWN: P at '+px+','+py+'  tile "'+c+'"  '+(solidS.indexOf(c)<0?'standable':'NOT STANDABLE'));
    let land=0, wet=0;
    for(let dy=-6;dy<=6;dy++) for(let dx=-6;dx<=6;dx++){
      const ch=(D.map[py+dy]||'')[px+dx]||'w';
      if(ch==='w'||ch==='W') wet++; else land++; }
    L.push('       within 6 tiles: '+land+' land, '+wet+' water');
  }
  L.push('');
  // where does island A's land actually stop on each bridge row?
  for(let y=B.cy-half; y<B.cy-half+B.w; y++){
    let lastA=-1;
    for(let x=0;x<ISLE_A_W;x++) if(D.map[y][x]!=='w') lastA=x;
    L.push('  row y'+y+': island A land ends at x='+lastA+', bridge starts at x='+B.x0
           +(lastA>=0 && lastA>=B.x0-1 ? '  (joined)' : '  <-- GAP of '+(B.x0-lastA-1)+' water tiles'));
  }
}catch(e){ L.push('THREW: '+(e&&e.stack||e)); }
o.textContent=L.join('\n');
</script>
